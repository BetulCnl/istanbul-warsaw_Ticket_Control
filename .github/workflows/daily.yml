name: Günlük fiyat kontrolü
on:
  schedule:
    - cron: "17 5 * * *"   # her gün 05:17 UTC (Polonya'da sabah ~06:17/07:17)
  workflow_dispatch: {}      # elle de çalıştırılabilir
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/fetch.py
      - name: Veriyi kaydet
        run: |
          git config user.name "fiyat-botu"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || git commit -m "Günlük fiyatlar"
          git push
